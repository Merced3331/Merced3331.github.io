     <div class="grid-container">
        <div>
            <figure>
                <audio controls>
                    <source src="nvm/What_Have_I_Done.mp3">
                </audio>
                <figcaption><i>What Have I Done...</i> (<i>Natalie vs. the Mind</i>)
                <br>
                SPOILER WARNING: IF YOU HAVEN’T PLAYED NVM DO NOT READ FURTHER!!!
                <br>
                <br>
                This is what I consider to be my best work yet. In the ending that this plays in, Iris (Natalie’s best friend) 
                is killed by Natalie, but she doesn’t remember doing it. Natalie blacks out and feels that her clothes are wet 
                when she wakes up, then when she finally opens her eyes she sees a gruesome image of her best friend dead on the 
                ground. 
                <br>
                <br>
                This entire song is meant to show the feelings that Natalie is feeling at this moment. The song begins 
                with the light piano motif that has been associated with Iris the whole game, but twisted and slower. Then an 
                odd echo sound plays to show that something is wrong. When the motif fades, a different piano starts to play, 
                this one more ominous in tone. This is when Natalie realizes that Iris isn’t responding. A heartbeat plays in 
                the background because now Natalie is panicking. Then she opens her eyes. This is when the deep slow piano plays. 
                Showing how petrified she is. Seeing her friend dead on the floor.
                <br>
                <br>
                Natalie tries to say that what she’s seeing 
                isn’t real. Then the guitar motif that plays in Natalie’s theme comes in. This being Natalie remembering all 
                of the good memories that they shared with each other all of these years, still trying to doubt what she is 
                seeing. Once the heartbeat and bass come in, this is when Natalie finally comes to terms with reality. Her best 
                friend is dead. The regret of her actions take over her like a plague because she believes she is the one who 
                committed this heinous act.
                <br>
                <br>
                Once the heartbeat and deep piano stops playing, a new, distorted piano plays, with 
                higher notes and echoing. This is to symbolize Collapsa offering Natalie a way out, by giving up her body, 
                Collapsa will be able to make Natalie’s pain go away. Once the heartbeat and bass continues, this is when Collapsa 
                takes over Natalie’s body. The same piano from before plays showing that Natalie is still in there somewhere. The 
                ending of the song plays Iris’ motif with a fading out heartbeat showing that both Iris and Natalie are gone from 
                this world. The final thing that plays is Iris’ motif because Iris is that last thing that Natalie thinks of before 
                fully being taken over by Collapsa.
                </figcaption>
            </figure>
        </div>
        <div>
            <figure>
                <audio controls>
                    <source src="my_audio/Damnation.mp3">
                </audio>
                <figcaption>Boss theme called <i>Damnation</i>
                <br>
                This was originally meant to be a boss theme for <i>Eldritch Incident: 1948</i> but was cut due to time restraints. 
                I am still really proud of this song and it being one of the first songs I made in SoundTrap. The vocals in 
                the beginning are meant to represent the fact that you are facing another worldly being beyond human comprehension. 
                The fast piano and drums build up the tension of the fight, while the violin and the electric guitar showcase 
                the determination of the characters to win this fight. I took a lot of inspiration from the boss themes of 
                <i>Persona 5</i> and the music of the <i>DOOM</i> series to push me in the right direction for this song. I hope that one day 
                I can actually use this song for something.
                </figcaption>
            </figure>
        </div>

                <figcaption><i>Fun in the Sand</i> (Happy Level) (<i>Overwrought</i>)
                <br>
                For this song I added in some smooth electric guitars to try and fit that beach vibe that the level was 
                going for while also keeping the feeling of a fun day out with your family with the drums and synths. 
                Keeping a groovy tone to also keep the player moving. 
                </figcaption>
            </figure>

        <div>
            <figure>
                <audio controls>
                    <source src="my_audio/Anxiety.mp3">
                </audio>
                <figcaption><i>Sinking</i> (Anxiety Level) (<i>Overwrought</i>)
                <br>
                The bass in this song is meant to represent that tightness in your chest when experiencing anxiety, while 
                that vocals are symbolic of the spiraling thoughts that can cause an anxiety attack. The main motif of the 
                keys is to represent the uncertainty of if your thoughts are even true or could happen. Finally, the beat 
                is meant to represent the feeling of needing to move and run from the problems you are facing.
                </figcaption>
            </figure>
        </div>

    <div class="grid-container">
        <div>
            <figure>
                <audio controls>
                    <source src="my_audio/Spirit_of_Wonder.mp3">
                </audio>
                <figcaption>Song called <i>Spirit of Wonder</i>
                <br>
                I created this song midway through making my album <i>Touch Starved</i>. I wanted to make a more up beat song considering 
                at the time I was making a lot of slower songs. I didn’t exactly know what I wanted this song to be, but I just went 
                with the flow and made something I am really proud of. Originally, I was going to make this a part of my album, but 
                decided that the tone of the song didn’t fit in with the rest of the songs in the album, so now it’s just an unused 
                song that I have in my library. If this song were to be put in a game I could see it play as you are walking around 
                a vibrant town or city setting.
                </figcaption>
            </figure>
        </div>
        <div>
            <figure>
                <audio controls>
                    <source src="my_audio/Warm_On_A_Rainy_Day.mp3">
                </audio>
                <figcaption>Song called <i>Warm On A Rainy Day</i>
                <br>
                I wanted to try out a new style of music and take a stab at a lofi beat. I don’t know much about the genre 
                but wanted to try it out anyway. I added in some slow synths and a light beat to try and get that feeling of 
                calmness that lofi can provide. I also wanted to make sure that there wasn’t too much overlap between the 
                different sounds to not make the song feel cluttered.
                </figcaption>
            </figure>
        </div>
    </div>
    <div class="grid-container">
        <div>
            <figure>
                <audio controls>
                    <source src="touch_starved/Lost_Feeling(3).mp3">
                </audio>
                <figcaption><i>Lost Feeling</i> (3) (<i>Touch Starved</i>)
                <br>
                This song is about remembrance. Even though there was a lot of bad. There was also a lot of good. Going 
                through their old photos brings back that love that they once felt for their ex. Feeling everything for 
                a second time, the love, the joy, the happiness, wondering where it all went wrong. Doing this drives our 
                protagonist to madness, wondering what they had done wrong, and if they could’ve prevented this outcome. 
                Looking back through these happy memories with sadness and despair. Wishing for one more happy memory.
                </figcaption>
            </figure>
        </div>
        <div>
            <figure>
                <audio controls>
                    <source src="touch_starved/Hold_Me_Close(8).mp3">
                </audio>
                <figcaption><i>Hold Me Close</i> (8) (<i>Touch Starved</i>)
                <br>
                This was the first song I made for the album that inspired me to create the rest of the rest of the songs. 
                The best way I can describe the feeling I wanted to convey is coming home
                after a long day of work, feeling tired and stressed, the only thing that can make you feel better is the warm embrace of the person you love the most. 
                Once you are in their arms, nothing else in the world matters. This is personally my favorite song on the album.  

                </figcaption>
            </figure>
